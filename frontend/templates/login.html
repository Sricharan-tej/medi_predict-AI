{% extends 'layout.html' %}

{% block content %}
<section class="auth-section">
    <div class="auth-card-container">
        <div class="card auth-card glass">
            <div class="auth-header text-center">
                <i class="fa-solid fa-heart-pulse logo-icon"></i>
                <h2>Welcome Back</h2>
                <p>Access the MediPredict AI portal to check symptoms, view previous prediction histories, and print reports.</p>
            </div>
            
            <form action="{{ url_for('auth.login') }}" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="login_input"><i class="fa-solid fa-user-doctor"></i> Username or Email</label>
                    <input type="text" name="login_input" id="login_input" placeholder="Enter your username or email" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
            </form>
            
            <div class="auth-footer text-center mt-20">
                <p>New to MediPredict AI? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
