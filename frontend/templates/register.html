{% extends 'layout.html' %}

{% block content %}
<section class="auth-section">
    <div class="auth-card-container">
        <div class="card auth-card glass">
            <div class="auth-header text-center">
                <i class="fa-solid fa-heart-pulse logo-icon"></i>
                <h2>Create Account</h2>
                <p>Register to unlock personal symptom analysis, historical predictions tracking, and clinical PDF report generation.</p>
            </div>
            
            <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                    <input type="text" name="username" id="username" placeholder="e.g., patient123" required>
                </div>
                
                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                    <input type="email" name="email" id="email" placeholder="e.g., patient@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" name="password" id="password" placeholder="Min. 8 characters" required>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password"><i class="fa-solid fa-lock-open"></i> Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm your password" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-user-plus"></i> Register</button>
            </form>
            
            <div class="auth-footer text-center mt-20">
                <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
